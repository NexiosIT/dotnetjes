services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Booking: "Host=db;Port=5432;Database=booking;Username=booking;Password=booking"
      Smtp__Host: mailpit
      DataProtection__KeysPath: /keys
    volumes:
      - dpkeys:/keys
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      # Already running Postgres locally? Start with DB_PORT=5433 (and point appsettings at it for dotnet run).
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps its data in /var/lib/postgresql/18/docker, so mount the parent
      # (mounting .../data like older versions makes the container refuse to start).
      - ./.container-data/postgres:/var/lib/postgresql
    healthcheck:
      # Check over TCP: during first-time init Postgres runs a temporary socket-only server,
      # which a plain pg_isready would report as ready before the app can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U booking -d booking"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  dpkeys:
